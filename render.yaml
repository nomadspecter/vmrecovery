services:
  - type: web
    name: vmrecovery-demo
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: VMR_SIMULATE
        value: "true"
      - key: VMR_WORKER
        value: "true"
      - key: VMR_CHECK_SECONDS
        value: "10"
      - key: VMR_MAX_RESTORES_PER_HOUR
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: "postgresql://postgres.bggtmgrdjdrwwucgyqig:FoHwFabmlrELWe91@aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require"
