{% extends "base.html" %}
{% block heading %}Edit {{ vm.vm_name }}{% endblock %}
{% block body %}
<div class="panel"><form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form">
    <div><label for="class_group">Class group</label><input type="text" id="class_group" name="class_group" value="{{ vm.class_group }}" required></div>
    <div><label for="heartbeat_property">Heartbeat guest property (optional)</label><input type="text" id="heartbeat_property" name="heartbeat_property" value="{{ vm.heartbeat_property or '' }}"></div>
    <div><label for="interval_minutes">Snapshot interval (minutes)</label><input type="number" id="interval_minutes" name="interval_minutes" value="{{ vm.interval_minutes }}" min="1" max="1440"></div>
    <div><label for="retention_count">Snapshots to keep</label><input type="number" id="retention_count" name="retention_count" value="{{ vm.retention_count }}" min="1" max="20"></div>
    <div>
      <label for="assigned_student_id">Assigned Student</label>
      <select id="assigned_student_id" name="assigned_student_id">
        <option value="">- None (Unassigned) -</option>
        {% for s in students %}
          <option value="{{ s.user_id }}" {{ 'selected' if vm.assigned_student_id == s.user_id }}>{{ s.username }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>&nbsp;</label>
      <label style="color:#1f2933;display:inline-block;margin-right:12px"><input type="checkbox" name="pre_session" {{ 'checked' if vm.pre_session_snapshot }}> Snapshot before every session</label>
      <label style="color:#1f2933;display:inline-block"><input type="checkbox" name="is_template" {{ 'checked' if vm.is_template }}> Golden Template</label>
    </div>
  </div>
  <div style="margin-top:14px"><button class="btn" type="submit">Save</button> <a class="btn o" href="{{ url_for('main.vms') }}">Cancel</a></div>
</form></div>
{% endblock %}
